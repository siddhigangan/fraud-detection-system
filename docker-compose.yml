services:
  broker:
    image: confluentinc/cp-kafka:7.4.0
    container_name: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,ANYWHERE:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker:29092,ANYWHERE://localhost:9092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,ANYWHERE://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD", "kafka-cluster", "cluster-id", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"

  producer:
    build: ./producer
    container_name: producer
    restart: on-failure
    depends_on:
      broker:
        condition: service_healthy
    environment:
      KAFKA_BROKER: "broker:29092"

  processor:
    build: ./processor
    container_name: processor
    restart: on-failure
    depends_on:
      broker:
        condition: service_healthy
      mongodb:
        condition: service_started
    environment:
      KAFKA_BROKER: "broker:29092"
      MONGO_URI: "mongodb://mongodb:27017"

  dashboard:
      build: ./dashboard
      container_name: dashboard
      ports:
        - "8000:8501"  # Access via http://localhost:8000
      environment:
        - MONGO_URI=mongodb://mongodb:27017
      restart: always 